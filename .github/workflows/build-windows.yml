name: Build Windows portable EXE

on:
  push:
    branches: [main]
    paths:
      - '**.cs'
      - '**.csproj'
      - 'app.manifest'
      - 'Assets/**'
      - 'Build-Windows.ps1'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 unsigned
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build portable EXE
        shell: pwsh
        run: ./Build-Windows.ps1

      - name: Prepare download and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'dist/win-x64/RaduSelf.PCCheck.exe'
          if (-not (Test-Path $exe)) { throw 'Expected EXE was not produced.' }
          New-Item -ItemType Directory -Path 'artifacts' -Force | Out-Null
          Copy-Item $exe 'artifacts/RaduSelf.PCCheck.exe'
          Copy-Item 'LICENSE' 'artifacts/LICENSE.txt'
          Copy-Item 'PRIVACY.md' 'artifacts/PRIVACY.md'
          @(
            'RADUSELF PC Check - Windows x64 portable'
            'Unsigned build. No code signing approval has been obtained yet.'
            'Download and extract the archive, then double-click RaduSelf.PCCheck.exe.'
            'No Microsoft account or installation is required.'
            'To remove: close the application and delete the extracted files.'
            'Optional language preference: %LOCALAPPDATA%\\RaduSelfPCCheck'
            "Source commit: $env:GITHUB_SHA"
          ) | Set-Content -Encoding utf8 'artifacts/README.txt'
          $hash = (Get-FileHash 'artifacts/RaduSelf.PCCheck.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RaduSelf.PCCheck.exe" | Set-Content -Encoding ascii 'artifacts/SHA256SUMS.txt'
          "Unsigned EXE SHA-256: $hash" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload unsigned portable build
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: RADUSELF-PC-Check-win-x64-unsigned
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
